name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and test packages
        run: python -m pip install -r requirements-dev.txt
      - name: Validate real model data and API
        run: python -m pytest -q tests/
      - name: Build deployment image
        run: docker build --tag shedding-outlook:test .

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1720 920" width="1720" height="920" role="img" aria-labelledby="ttl desc"><title id="ttl">Shedding Outlook forecasting model architecture</title><desc id="desc">PGCB, ERA5, and holiday data are aligned, transformed to origin-time features, and passed into a twelve-feature baseline and a twenty-eight-feature XGBoost model for one-hour, six-hour and twenty-four-hour predictions. Historical rolling-origin evaluations and separate final-refit model artifacts follow distinct paths.</desc><rect x="0" y="0" width="1720" height="920" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D2937}.t{font-weight:700;font-size:36px}.subtitle{font-size:20px;fill:#526175}.stage{font-weight:700;font-size:17px;letter-spacing:1px;fill:#284761}.hd{font-weight:700;font-size:21px}.body{font-size:17px;fill:#374659}.small{font-size:15px;fill:#536477}.output{font-size:17px;font-weight:700;fill:#253F59}.foot{font-size:17px;fill:#475569}.line{stroke:#6F879B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.branch{stroke:#91A1AE;stroke-width:2.5;fill:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6F879B"/></marker></defs>

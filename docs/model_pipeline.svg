<text x="68" y="239" class="hd">
<tspan x="68" dy="0">PGCB electricity</tspan>
</text>
<text x="68" y="263" class="small">
<tspan x="68" dy="0">Shedding; demand; generation</tspan>
</text>
<rect x="50" y="301" width="260" height="77" rx="8" fill="#F0F5F9" stroke="#AABBCB" stroke-width="2"/>
<text x="68" y="332" class="hd">
<tspan x="68" dy="0">ERA5 weather</tspan>
</text>
<text x="68" y="356" class="small">
<tspan x="68" dy="0">52-point national aggregate</tspan>
</text>
<rect x="50" y="394" width="260" height="77" rx="8" fill="#F0F5F9" stroke="#AABBCB" stroke-width="2"/>
<text x="68" y="425" class="hd">
<tspan x="68" dy="0">Bangladesh calendar</tspan>
</text>
<text x="68" y="449" class="small">
<tspan x="68" dy="0">Holidays; Fri–Sat weekend</tspan>
</text>
<rect x="355" y="247" width="265" height="221" rx="8" fill="#F6F8FA" stroke="#AABBCB" stroke-width="2"/>
<text x="376" y="284" class="hd">
<tspan x="376" dy="0">Quality and alignment</tspan>
</text>
<text x="376" y="323" class="body">
<tspan x="376" dy="0">• Audit anomalous readings</tspan>
<tspan x="376" dy="29">• Deduplicate hourly records</tspan>
<tspan x="376" dy="29">• Align timestamps</tspan>
<tspan x="376" dy="29">• Handle missing observations</tspan>
<tspan x="376" dy="29">• Match national sources</tspan>
</text>
<rect x="660" y="227" width="300" height="261" rx="8" fill="#F0F5F9" stroke="#AABBCB" stroke-width="2"/>
<text x="680" y="266" class="hd">
<tspan x="680" dy="0">Origin-time features</tspan>
</text>
<text x="680" y="306" class="body">
<tspan x="680" dy="0">• Current shedding state</tspan>
<tspan x="680" dy="30">• Lagged shedding: 1/24/168h</tspan>
<tspan x="680" dy="30">• Rolling 24/168h summaries</tspan>
<tspan x="680" dy="30">• System / weather / calendar</tspan>
<tspan x="680" dy="30">• Available by origin t</tspan>
</text>
<rect x="1000" y="209" width="315" height="127" rx="8" fill="#F3F7F9" stroke="#AABBCB" stroke-width="2"/>
<text x="1020" y="245" class="hd">
<tspan x="1020" dy="0">12-feature baseline</tspan>
</text>
<text x="1020" y="276" class="body">
<tspan x="1020" dy="0">State-aware persistence</tspan>
</text>
<text x="1020" y="301" class="small">
<tspan x="1020" dy="0">XGBoost; seeds 0, 1, 2</tspan>
</text>
<rect x="1000" y="364" width="315" height="127" rx="8" fill="#EDF4FB" stroke="#AABBCB" stroke-width="2"/>
<text x="1020" y="400" class="hd">
<tspan x="1020" dy="0">28-feature expanded</tspan>
</text>
<text x="1020" y="431" class="body">
<tspan x="1020" dy="0">System + weather + calendar</tspan>
</text>
<text x="1020" y="456" class="small">
<tspan x="1020" dy="0">XGBoost; seeds 0, 1, 2</tspan>
</text>
<rect x="1360" y="246" width="310" height="225" rx="8" fill="#F7FAFC" stroke="#AABBCB" stroke-width="2"/>
<text x="1382" y="287" class="hd">
<tspan x="1382" dy="0">Probability of shedding</tspan>
</text>
<text x="1382" y="327" class="output">
<tspan x="1382" dy="0">P(y at t + 1 h)</tspan>
</text>
<text x="1382" y="368" class="output">
<tspan x="1382" dy="0">P(y at t + 6 h)</tspan>
</text>
<text x="1382" y="409" class="output">
<tspan x="1382" dy="0">P(y at t + 24 h)</tspan>
</text>
<text x="1382" y="446" class="small">
<tspan x="1382" dy="0">Separate classifier per horizon</tspan>
</text>
<path d="M50 548 H1670" stroke="#D6DEE7" stroke-width="2"/>
<text x="50" y="584" class="stage">
<tspan x="50" dy="0">TWO DISTINCT OUTPUT PATHS</tspan>
</text>

<path class="line" d="M855 606 H1280 V631" marker-end="url(#arrow)"/>
<rect x="80" y="641" width="755" height="200" rx="8" fill="#F8FAFC" stroke="#9DAFBE" stroke-width="2"/>
<text x="103" y="681" class="hd">
<tspan x="103" dy="0">A. Historical, out-of-sample predictions</tspan>
</text>
<text x="103" y="719" class="body">
<tspan x="103" dy="0">Nine expanding quarterly tests (2024 Q1–2026 Q1); lead-time gap</tspan>
</text>
<text x="103" y="748" class="body">
<tspan x="103" dy="0">Brier, ROC-AUC, calibration, transitions and drift analysis</tspan>
</text>
<text x="103" y="786" class="output">
<tspan x="103" dy="0">web/data/outlook.json  •  16,099 archived origin hours</tspan>
</text>
<text x="103" y="813" class="small">
<tspan x="103" dy="0">web/data/report.json  •  study summaries</tspan>
</text>
<rect x="885" y="641" width="755" height="200" rx="8" fill="#F8FAFC" stroke="#9DAFBE" stroke-width="2"/>
<text x="908" y="681" class="hd">
<tspan x="908" dy="0">B. Separate final-refit models for serving</tspan>
</text>
<text x="908" y="719" class="body">
<tspan x="908" dy="0">Fit on eligible historical training data after evaluation</tspan>
</text>
<text x="908" y="748" class="body">
<tspan x="908" dy="0">2 configurations × 3 horizons × 3 seeds = 18 model files</tspan>
</text>
<text x="908" y="786" class="output">
<tspan x="908" dy="0">artifacts/models/*.json  •  manifest.json</tspan>
</text>
<text x="908" y="813" class="small">
<tspan x="908" dy="0">FastAPI POST /api/predict-from-features (complete feature vector)</tspan>
</text>
<text x="50" y="887" class="foot">
<tspan x="50" dy="0">Important: the final-refit serving models are distinct from the fold-specific models used to score out-of-sample forecasts.</tspan>
</text>

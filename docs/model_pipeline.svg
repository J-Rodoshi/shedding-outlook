</text>
<text x="660" y="171" class="stage">
<tspan x="660" dy="0">03   FEATURES AT t</tspan>
</text>
<text x="1000" y="171" class="stage">
<tspan x="1000" dy="0">04   SAME LEARNER</tspan>
</text>
<text x="1360" y="171" class="stage">
<tspan x="1360" dy="0">05   FORECAST OUTPUT</tspan>
</text>
<path class="line" d="M310 356 H351" marker-end="url(#arrow)"/>
